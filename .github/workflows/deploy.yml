name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # 必须获取完整 git 历史以获取正确的日期

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Restore Quartz cache
        uses: actions/cache@v5
        with:
          path: |
            .quartz/plugins
            .quartz-cache
          key: ${{ runner.os }}-quartz-${{ hashFiles('quartz.lock.json', 'quartz.config.default.yaml', 'quartz.config.ts', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-quartz-

      - name: Install dependencies
        run: npm ci

      - name: Install Quartz plugins (skip existing)
        run: node ./quartz/bootstrap-cli.mjs plugin install

      - name: Force reinstall folder-page from fork
        run: |
          rm -rf .quartz/plugins/folder-page
          node ./quartz/bootstrap-cli.mjs plugin install folder-page

      - name: Build Quartz site
        run: node ./quartz/bootstrap-cli.mjs build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5